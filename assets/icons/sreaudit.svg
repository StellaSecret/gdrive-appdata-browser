<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>

  <!-- shield: reliability / protection -->
  <path d="M30 8
           L47 15
           V29
           C47 43 39.5 52.5 30 56.5
           C20.5 52.5 13 43 13 29
           V15
           Z"
        fill="url(#shieldFill)" stroke="#3b82f6" stroke-width="3" stroke-linejoin="round"/>

  <!-- monitoring pulse -->
  <path d="M16.5 32
           H22
           L25.5 23
           L30 40
           L33.5 32
           H43.5"
        fill="none" stroke="#4ade80" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- verified / audit-pass badge -->
  <circle cx="46" cy="16" r="10" fill="#0f172a" stroke="#0f172a" stroke-width="3"/>
  <circle cx="46" cy="16" r="9.5" fill="#16a34a"/>
  <path d="M41.5 16.3 L44.5 19.3 L50.5 12.5" fill="none" stroke="#f0fdf4"
