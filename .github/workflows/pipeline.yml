name: Pipeline

# Single linear pipeline: unit tests & mutation tests run in parallel ->
# build wasm bundle -> e2e smoke tests -> deploy to GitHub Pages ->
# post-deploy smoke check. The wasm bundle is built exactly once and that
# same artifact is reused for both the e2e job and the Pages deployment -
# no duplicate builds.
#
# Deploy only runs for pushes to `main`, or a manual run (workflow_dispatch)
# on `main` (e.g. to re-deploy without an empty commit). PRs stop after the
# e2e job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        # Pinned to match rust-toolchain.toml exactly. dtolnay/rust-toolchain
        # does NOT read rust-toolchain.toml itself (confirmed against the
        # project's own issue tracker - not a supported feature); using
        # @stable here would install latest-stable first, then rustup's own
        # directory-based override would silently switch to 1.91.0 anyway
        # on the first `cargo` invocation because of the toml file - correct
        # end result, but two toolchain downloads and nothing in the
        # workflow file actually saying why. Being explicit here avoids
        # both problems. If you bump rust-toolchain.toml, bump this too.
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --verbose

      - name: Install cargo-audit
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0

      - name: Audit dependencies for known vulnerabilities
        # cargo-binstall can report "already installed" (e.g. when
        # Swatinem/rust-cache restores ~/.cargo's install receipts from
        # cache without the actual binary) and skip installing anything -
        # so verify `cargo audit` actually works before trusting it, same
        # defensive pattern as the dioxus-cli install in the build job below.
        run: |
          cargo binstall cargo-audit --no-confirm --locked

          if ! cargo audit --version >/dev/null 2>&1; then
            echo "cargo-binstall's cargo-audit isn't actually runnable - forcing a reinstall."
            cargo binstall cargo-audit --no-confirm --locked --force || cargo install cargo-audit --locked
          fi

          cargo audit

  mutation-tests:
    name: Mutation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.91.0

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Run mutation tests
        id: mutants
        # The only files with unit tests are src/main.rs and src/drive.rs;
        # gis.rs/browser.rs are browser/web-glue with no test surface.
        # exclude_re covers mutants that can't be killed without a bigger
        # test bed: the main() entry stub, the Dioxus UI components, and the
        # async Drive API functions (they make real HTTP calls through
        # gloo-net). cargo-mutants exits non-zero when any mutant survives.
        run: |
          cargo mutants -f src/main.rs -f src/drive.rs \
            --no-times --in-place --timeout 300 \
            --exclude-re '(in FileCard|in RevisionRow|replace main|get_json|list_appdata_files|list_revisions|download_revision|delete_revision)' \
            && ec=0 || ec=$?
          echo "Caught $(wc -l < mutants.out/caught.txt 2>/dev/null || echo 0), missed $(wc -l < mutants.out/missed.txt 2>/dev/null || echo 0), unviable $(wc -l < mutants.out/unviable.txt 2>/dev/null || echo 0)"
          echo "fatal=$ec" >> "$GITHUB_OUTPUT"

      - name: Mutation test summary
        if: always()
        run: |
          {
            echo "## Mutation Testing"
            echo ""
            echo "**$(wc -l < mutants.out/caught.txt 2>/dev/null || echo 0) caught / $(wc -l < mutants.out/missed.txt 2>/dev/null || echo 0) missed / $(wc -l < mutants.out/unviable.txt 2>/dev/null || echo 0) unviable**"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants
          path: mutants.out
          retention-days: 30

      - name: Fail if mutations missed
        if: steps.mutants.outputs.fatal != '0'
        run: |
          echo "cargo-mutants found missed/timeout mutants - exiting"
          exit ${{ steps.mutants.outputs.fatal }}

  build:
    name: Build WASM bundle
    needs: [unit-tests, mutation-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust with wasm32 target
        # See the matching comment in the unit-tests job above - pinned
        # explicitly rather than relying on @stable + implicit override.
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0

      # IMPORTANT: keep this version aligned with the `dioxus` (and
      # therefore `manganis`) version in Cargo.toml/Cargo.lock. `dx bundle`
      # reads a linker-embedded asset manifest that manganis writes at
      # compile time; if the CLI's manganis/cli-opt version doesn't match
      # the library version used to build the crate, asset bundling can
      # silently mis-link files (e.g. the preset sign-in icons rendering
      # as broken images) without failing the build outright. Check
      # `grep -A1 'name = "dioxus"' Cargo.lock` for the version to match.
      - name: Install dioxus-cli (prebuilt if possible, else compile)
        # cargo-binstall is much faster when it works (compiling dioxus-cli
        # from source takes 10+ minutes: swc, image codecs, git2, TLS,
        # etc). But we verify it actually produced a working `dx` on PATH
        # before trusting it - if not (e.g. no prebuilt asset available for
        # this version/platform), fall back to compiling from source
        # instead of failing the whole pipeline.
        run: |
          cargo binstall dioxus-cli --version 0.7.10 --no-confirm --locked || true

          if ! command -v dx >/dev/null 2>&1; then
            echo "cargo-binstall did not produce a usable 'dx' on PATH - falling back to 'cargo install' (slower, but known to work)."
            cargo install dioxus-cli --version 0.7.10 --locked
          fi

          echo "Using dx at: $(command -v dx)"
          dx --version

      - name: Set base_path for GitHub Pages project site
        # Applied unconditionally (not just on deploy) so the exact same
        # artifact that gets smoke-tested is the one that gets deployed.
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          sed -i "s|^# base_path.*|base_path = \"${REPO_NAME}\"|" Dioxus.toml
          echo "--- Dioxus.toml ---"
          cat Dioxus.toml

      - name: Build web bundle (release)
        env:
          # Per-project quick-sign-in presets (see KNOWN_PROJECTS in
          # src/main.rs). Each is optional: an unset secret resolves to an
          # empty string, which the app treats as "not configured" and
          # simply omits that preset button. Add a new project by adding
          # both a repo secret here and a line in KNOWN_PROJECTS.
          GOOGLE_WEB_CLIENT_ID_PEOPLEMODELER: ${{ secrets.GOOGLE_WEB_CLIENT_ID_PEOPLEMODELER }}
          GOOGLE_WEB_CLIENT_ID_ASTHMATRACK: ${{ secrets.GOOGLE_WEB_CLIENT_ID_ASTHMATRACK }}
          GOOGLE_WEB_CLIENT_ID_CVGENERATOR: ${{ secrets.GOOGLE_WEB_CLIENT_ID_CVGENERATOR }}
          GOOGLE_WEB_CLIENT_ID_SREAUDIT: ${{ secrets.GOOGLE_WEB_CLIENT_ID_SREAUDIT }}
        # --out-dir is passed explicitly rather than relying on Dioxus.toml's
        # out_dir, which has been unreliable across dioxus-cli versions.
        run: dx bundle --platform web --release --out-dir docs

      - name: Verify build output (fail fast with a clear message)
        # Defensive check: if dx's output location changes again in a future
        # CLI version, find the real output instead of failing on a missing
        # `docs/index.html` with no explanation.
        run: |
          if [ -f docs/index.html ]; then
            echo "Found docs/index.html as expected."
            exit 0
          fi

          echo "docs/index.html not found - searching target/dx for the real output..."
          FOUND=$(find target/dx -maxdepth 6 -type f -name index.html -path '*/web/public/*' 2>/dev/null | head -n1)

          if [ -z "$FOUND" ]; then
            echo "::error::Could not locate built web output anywhere under docs/ or target/dx/. dx bundle output layout may have changed - check 'dx --version' and dx bundle's own logs above."
            find target/dx -maxdepth 4 2>/dev/null || true
            exit 1
          fi

          SRC_DIR=$(dirname "$FOUND")
          echo "Found build output at $SRC_DIR - copying to docs/"
          mkdir -p docs
          cp -r "$SRC_DIR"/* docs/

      - name: Add 404 fallback for client-side routing
        run: cp docs/index.html docs/404.html

      - name: Upload build artifact (for e2e job)
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: docs/
          retention-days: 7

      - name: Upload Pages artifact (for deploy job)
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  e2e:
    name: E2E smoke tests
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: docs

      - name: Nest build under its production base_path
        # Mirrors the /repo-name/ path the site will actually be served
        # from on GitHub Pages, so the smoke tests exercise the real
        # deployed asset paths rather than a root-relative approximation.
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          mkdir -p site_root/"$REPO_NAME"
          cp -r docs/* site_root/"$REPO_NAME"/
          echo "SITE_ROOT=$PWD/site_root" >> "$GITHUB_ENV"
          echo "PW_BASE_URL=http://127.0.0.1:4173/${REPO_NAME}/" >> "$GITHUB_ENV"

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Run e2e smoke tests
        working-directory: e2e
        env:
          PW_BASE_URL: ${{ env.PW_BASE_URL }}
          PW_SERVE_DIR: ${{ env.SITE_ROOT }}
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: e2e
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No rebuild here - reuses the Pages artifact uploaded by the
      # `build` job earlier in this same workflow run.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  post-deploy-check:
    name: Verify live Pages deployment
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the deployed page to respond
        # GitHub Pages / CDN propagation can lag a few seconds behind
        # deploy-pages reporting success, so retry instead of checking once.
        run: |
          URL="${{ needs.deploy.outputs.page_url }}"
          echo "Checking $URL"
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Got HTTP 200 on attempt $i."
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "::error::Deployed site at $URL never returned HTTP 200 after 10 attempts."
          exit 1

      - name: Verify deployed page content
        # Catches the class of bug we've hit before (wrong base_path,
        # dx bundle output landing somewhere unexpected) by checking the
        # live page actually contains real app content, not just a 200.
        run: |
          URL="${{ needs.deploy.outputs.page_url }}"
          BODY=$(curl -s "$URL")
          if ! echo "$BODY" | grep -q "appDataFolder Browser"; then
            echo "::error::Deployed page at $URL doesn't contain the expected title text 'appDataFolder Browser'. The build may have deployed the wrong content (base_path misconfiguration, stale artifact, etc)."
            exit 1
          fi
          echo "Deployed page content looks correct."
